<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Copilot 本地演示</title>
  <link rel="stylesheet" href="../content.css">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #172033;
      background: #eef2f7;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: #eef2f7; }
    .demo-browser {
      min-height: 100vh;
      background:
        radial-gradient(circle at 82% 7%, rgba(37, 99, 235, .10), transparent 28%),
        #eef2f7;
    }
    .demo-topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
      color: #fff;
      background: #111d32;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .18);
    }
    .demo-brand { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 800; }
    .demo-brand-mark {
      width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px;
      background: linear-gradient(135deg, #2f74ff, #5c70f5);
    }
    .demo-nav { display: flex; gap: 28px; color: #cbd6e8; font-size: 14px; }
    .demo-nav strong { color: #fff; }
    .demo-safe {
      margin: 20px 28px 0;
      padding: 11px 16px;
      border: 1px solid #cfe0ff;
      border-radius: 12px;
      color: #345a98;
      background: #f5f9ff;
      font-size: 13px;
    }
    .demo-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 16px 28px;
      padding: 15px 18px;
      border: 1px solid #dce3ed;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .05);
    }
    .demo-tabs { display: flex; gap: 8px; }
    .demo-tabs button {
      padding: 9px 15px;
      border: 1px solid #d5dce8;
      border-radius: 9px;
      color: #405068;
      background: #fff;
      cursor: pointer;
    }
    .demo-tabs button.active { border-color: #2563eb; color: #1d4ed8; background: #eef4ff; font-weight: 800; }
    .demo-summary { color: #64748b; font-size: 13px; }
    .demo-layout {
      display: grid;
      grid-template-columns: minmax(370px, .8fr) minmax(520px, 1.2fr);
      gap: 16px;
      margin: 0 28px;
      padding-bottom: 28px;
    }
    #fixture-list { display: grid; gap: 10px; }
    .job-card-wrapper {
      padding: 17px 18px;
      border: 1px solid #dce3ed;
      border-radius: 13px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, .04);
      cursor: pointer;
      transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
    }
    .job-card-wrapper:hover, .job-card-wrapper.selected {
      border-color: #7aa5ff;
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(37, 99, 235, .10);
    }
    .job-card-wrapper a { color: #172033; text-decoration: none; }
    .job-card-top { display: flex; justify-content: space-between; gap: 14px; }
    .job-name { font-size: 16px; font-weight: 850; }
    .salary { color: #e04444; font-weight: 850; white-space: nowrap; }
    .company-name { margin-top: 8px; color: #34435a; font-weight: 700; }
    .job-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .job-tags span { padding: 4px 7px; border-radius: 6px; color: #64748b; background: #f1f4f8; font-size: 11px; }
    .job-detail {
      min-height: 610px;
      padding: 28px 30px;
      border: 1px solid #dce3ed;
      border-radius: 13px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, .04);
    }
    .job-detail h2 { margin: 0 0 8px; font-size: 25px; }
    .detail-meta { color: #64748b; }
    .detail-divider { height: 1px; margin: 22px 0; background: #e7ecf3; }
    .detail-heading { margin: 0 0 10px; font-size: 16px; }
    .detail-copy { color: #415168; line-height: 1.85; }
    #fixture-communicate {
      margin-top: 22px;
      padding: 11px 24px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: #2563eb;
      font-weight: 800;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: grid;
      place-items: center;
      background: rgba(15, 23, 42, .32);
    }
    .modal-card { width: 320px; padding: 22px; border-radius: 14px; background: #fff; box-shadow: 0 24px 60px rgba(15,23,42,.28); }
    .modal-card button { width: 100%; padding: 9px; border: 0; border-radius: 8px; color: #fff; background: #2563eb; }
    .demo-cursor {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 2147483647;
      width: 22px;
      height: 22px;
      pointer-events: none;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .22), 0 4px 14px rgba(15, 23, 42, .24);
      transform: translate(-50%, -50%);
      transition: width .12s ease, height .12s ease, background .12s ease;
    }
    .demo-cursor.clicking { width: 34px; height: 34px; background: #18a88e; }
    @media (max-width: 820px) {
      .demo-layout { grid-template-columns: 1fr; }
      .job-detail { min-height: 420px; }
    }
  </style>
</head>
<body>
  <div class="demo-browser">
    <header class="demo-topbar">
      <div class="demo-brand"><span class="demo-brand-mark">J</span>Job Copilot 本地演示</div>
      <nav class="demo-nav"><strong>职位</strong><span>公司</span><span>消息</span><span>简历</span></nav>
    </header>
    <div class="demo-safe">本页面使用本地演示数据，仅用于录制产品功能；不包含真实账号、简历、头像、聊天记录或 API Key。</div>
    <div class="demo-toolbar">
      <div class="demo-tabs">
        <button id="fixture-page-a" class="active">AI / 产品方向</button>
        <button id="fixture-page-b">前端 / 测试方向</button>
      </div>
      <span class="demo-summary" id="fixture-contact-count">已沟通 0 · 当前 3 个演示岗位</span>
    </div>
    <div class="demo-layout">
      <div id="fixture-list"></div>
      <div class="job-detail" id="fixture-detail"></div>
    </div>
  </div>
  <div class="demo-cursor" aria-hidden="true"></div>
  <script>
    const fixturePages = {
      a: [
        ["AI 应用产品实习生", "星河科技", "上海", "250-350 元/天", 82, ["AI 产品", "B 端", "应届"]],
        ["AIGC 内容运营", "云帆工作室", "上海", "10-15K", 66, ["AIGC", "内容", "1-3 年"]],
        ["高级算法工程师", "未来算法研究院", "北京", "35-55K", 38, ["算法", "硕士", "5-10 年"]]
      ],
      b: [
        ["前端开发工程师", "光点网络", "上海", "15-22K", 78, ["React", "TypeScript", "经验不限"]],
        ["软件测试实习生", "青蓝互联", "上海", "220-300 元/天", 72, ["测试", "应届", "自动化"]],
        ["技术支持工程师", "远景信息", "杭州", "10-14K", 44, ["客户支持", "轮班", "1-3 年"]]
      ]
    };
    let fixtureContactCount = 0;
    let fixturePage = "a";
    const fixtureParams = new URLSearchParams(location.search);
    const fixtureAnalysisDelay = fixtureParams.has("slow") ? 2200 : 900;

    window.confirm = () => true;
    const chromeMock = {
      runtime: {
        id: "job-copilot-local-demo",
        lastError: null,
        getManifest: () => ({ version: "0.9.5" }),
        onMessage: { addListener() {} },
        sendMessage(message, callback) {
          if (message.type === "getSettings") {
            setTimeout(() => callback({
              ok: true,
              settings: {
                minScore: 70,
                autoRunOnJobsPage: false,
                restrictTargetLocation: false,
                profile: "demo",
                currentLocation: "上海",
                experienceYears: "3",
                graduateStatus: "unspecified",
                analysisSpeed: "balanced",
                targetDirections: "AI 产品、AI 应用、前端开发、软件测试",
                excludedDirections: "电话销售、直播运营",
                customInstructions: "应届岗位优先，重视项目证据与岗位内容",
                greetingStyle: "简洁、真诚"
              }
            }), 0);
            return;
          }
          if ([
            "registerAutomationSession", "updateAutomationSession", "appendAutomationLog",
            "focusAutomationTab", "controlAutomationTab", "completeIsolatedCommunication"
          ].includes(message.type)) {
            setTimeout(() => callback({ ok: true }), 0);
            return;
          }
          if (message.type === "getAutomationSession") {
            setTimeout(() => callback({ ok: true, session: null, isOwner: false }), 0);
            return;
          }
          if (message.type === "analyzeJob") {
            const source = fixturePages.a.concat(fixturePages.b)
              .find((item) => message.payload.title.includes(item[0]) || message.payload.jobName === item[0]);
            const score = source ? source[4] : 60;
            setTimeout(() => callback({
              ok: true,
              analysis: {
                score,
                decision: score >= 70 ? "recommend" : "manual_review",
                reasons: score >= 70
                  ? ["目标方向命中", "简历中存在相关项目证据", "岗位门槛与地点匹配"]
                  : ["方向或岗位门槛需要人工复核"],
                greeting: "您好，我的项目经历与岗位方向较匹配，希望进一步了解。"
              }
            }), fixtureAnalysisDelay);
            return;
          }
          setTimeout(() => callback?.({ ok: true }), 0);
        }
      },
      storage: { local: { set(_value, callback) { callback?.(); } } }
    };
    window.chrome.runtime = chromeMock.runtime;
    window.chrome.storage = chromeMock.storage;
    const demoCursor = document.querySelector(".demo-cursor");
    window.addEventListener("pointermove", (event) => {
      demoCursor.style.left = `${event.clientX}px`;
      demoCursor.style.top = `${event.clientY}px`;
    });
    window.addEventListener("pointerdown", () => demoCursor.classList.add("clicking"), true);
    window.addEventListener("pointerup", () => demoCursor.classList.remove("clicking"), true);

    function renderFixturePage(page) {
      fixturePage = page;
      document.querySelectorAll(".demo-tabs button").forEach((button) => button.classList.remove("active"));
      document.getElementById(page === "a" ? "fixture-page-a" : "fixture-page-b").classList.add("active");
      const list = document.getElementById("fixture-list");
      list.innerHTML = "";
      for (const [title, company, city, salary, _score, tags] of fixturePages[page]) {
        const card = document.createElement("div");
        card.className = "job-card-wrapper";
        card.innerHTML = `
          <div class="job-card-top">
            <a href="/job_detail/${encodeURIComponent(title)}"><div class="job-name">${title}</div></a>
            <div class="salary">${salary}</div>
          </div>
          <div class="company-name">${company} · ${city}</div>
          <div class="job-tags">${tags.map((tag) => `<span>${tag}</span>`).join("")}</div>`;
        card.addEventListener("click", (event) => {
          event.preventDefault();
          document.querySelectorAll(".job-card-wrapper").forEach((item) => item.classList.remove("selected"));
          card.classList.add("selected");
          setTimeout(() => renderFixtureDetail(title, company, city, tags), 180);
        });
        list.appendChild(card);
      }
      const first = fixturePages[page][0];
      list.firstElementChild?.classList.add("selected");
      renderFixtureDetail(first[0], first[1], first[2], first[5]);
    }

    function renderFixtureDetail(title, company, city, tags) {
      const detail = document.getElementById("fixture-detail");
      detail.innerHTML = `
        <h2>${title}</h2>
        <div class="detail-meta">${company} · ${city} · ${tags.join(" · ")}</div>
        <div class="detail-divider"></div>
        <h3 class="detail-heading">职位描述</h3>
        <div class="detail-copy">
          参与 AI 产品能力设计与功能迭代，协助梳理用户反馈、产品需求与验收标准。<br>
          能够使用数据和真实用户场景判断优先级，并与设计、研发和测试团队协作。<br><br>
          加分项：有 AI 应用、浏览器扩展、自动化工作流或 Web 项目实践。
        </div>
        <button id="fixture-communicate">立即沟通</button>`;
      detail.querySelector("button").addEventListener("click", () => {
        const modal = document.createElement("div");
        modal.className = "modal";
        modal.setAttribute("role", "dialog");
        modal.innerHTML = `<div class="modal-card"><p>本地演示：已记录沟通结果</p><button>留在职位页</button></div>`;
        modal.querySelector("button").addEventListener("click", () => {
          fixtureContactCount += 1;
          document.getElementById("fixture-contact-count").textContent = `已沟通 ${fixtureContactCount} · 当前 3 个演示岗位`;
          modal.remove();
        });
        document.body.appendChild(modal);
      });
    }

    document.getElementById("fixture-page-a").addEventListener("click", () => renderFixturePage("a"));
    document.getElementById("fixture-page-b").addEventListener("click", () => renderFixturePage("b"));
    renderFixturePage("a");
  </script>
  <script src="../content.js"></script>
</body>
</html>
