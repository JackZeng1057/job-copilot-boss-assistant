name: Release

# 版本号读取 manifest.json；仅手动触发或提交信息为“发布<版本号>”时发布。
# 普通代码整理提交不会上传安装包，也不会覆盖已有 Release。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: manifest
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: gate
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$COMMIT_MESSAGE" = "发布${VERSION}" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: commit message is not 发布${VERSION}"
          fi

      - name: Set up Node
        if: steps.gate.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        if: steps.gate.outputs.release == 'true'
        run: |
          node scripts/check.js
          node --test "tests/*.test.js"

      - name: Build extension archive
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          # 与本地检查共用依赖清单，避免遗漏运行模块。
          node scripts/stage-extension.js
          (cd dist/extension && zip -qr "../Job-Copilot-BOSS-Assistant-v${VERSION}.zip" .)
          unzip -l "dist/Job-Copilot-BOSS-Assistant-v${VERSION}.zip" | tail -1

      - name: Verify the archive carries no development files
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          if unzip -l "dist/Job-Copilot-BOSS-Assistant-v${VERSION}.zip" \
             | grep -Eq ' (tests|docs|marketing|output|\.playwright-cli|\.github)/'; then
            echo "Development files leaked into the release archive" >&2
            exit 1
          fi

      - name: Publish release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="dist/Job-Copilot-BOSS-Assistant-v${VERSION}.zip"
          # 同版本修复允许替换既有安装包，并更新该版本的发布说明。
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ARCHIVE" --clobber
            gh release edit "v${VERSION}" \
              --title "Job Copilot v${VERSION}" \
              --notes-file CHANGELOG.md
          else
            gh release create "v${VERSION}" "$ARCHIVE" \
              --title "Job Copilot v${VERSION}" \
              --notes-file CHANGELOG.md
          fi
